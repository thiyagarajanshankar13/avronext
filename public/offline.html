<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Offline · AvroNext</title>
    <style>
      :root { color-scheme: light dark; }
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; font: 15px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #fff; color: #172b4d; text-align: center; padding: 24px; box-sizing: border-box; }
      @media (prefers-color-scheme: dark) { body { background: #1d2125; color: #b6c2cf; } }
      img { width: 72px; height: 72px; }
      h1 { font-size: 20px; margin: 16px 0 4px; }
      p { margin: 0 0 20px; opacity: 0.8; }
      button { font: inherit; font-weight: 600; padding: 10px 20px; border: 0; border-radius: 20px; background: #0c66e4; color: #fff; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You’re offline</h1>
      <p>AvroNext needs a connection to reach your Nextcloud.<br />Notes you wrote offline are kept and will sync.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
    <script>addEventListener('online', () => location.reload())</script>
  </body>
</html>
